name = "capture"
name_pretty = "Capture"
icon = "camera-photo"

[[entries]]
text = "Full screenshot"
actions = { "capture" = "directory=\"$(xdg-user-dir PICTURES)/Screenshots\" && mkdir -p \"$directory\" && grim \"$directory/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png\"" }
icon = "camera-photo"

[[entries]]
text = "Region screenshot"
actions = { "capture" = "geometry=$(slurp) && directory=\"$(xdg-user-dir PICTURES)/Screenshots\" && mkdir -p \"$directory\" && grim -g \"$geometry\" \"$directory/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png\"" }
icon = "accessories-screenshot-symbolic"

[[entries]]
text = "Pick screen color"
actions = { "pick" = "hyprpicker -a" }
icon = "color-select-symbolic"

[[entries]]
text = "Start screen recording"
actions = { "record" = "directory=\"$(xdg-user-dir VIDEOS)/Recordings\" && mkdir -p \"$directory\" && wf-recorder -f \"$directory/recording-$(date +%Y-%m-%d_%H-%M-%S).mp4\" >/dev/null 2>&1 &" }
icon = "media-record-symbolic"

[[entries]]
text = "Record selected region"
actions = { "record" = "geometry=$(slurp) && directory=\"$(xdg-user-dir VIDEOS)/Recordings\" && mkdir -p \"$directory\" && wf-recorder -g \"$geometry\" -f \"$directory/recording-$(date +%Y-%m-%d_%H-%M-%S).mp4\" >/dev/null 2>&1 &" }
icon = "media-record-symbolic"

[[entries]]
text = "Stop screen recording"
actions = { "stop" = "pkill -INT -x wf-recorder" }
icon = "media-playback-stop-symbolic"
