name = "desktop"
name_pretty = "Desktop"
icon = "preferences-desktop"

[[entries]]
text = "Focus window"
keywords = ["window", "switch", "focus"]
actions = { "focus" = "clients=$(hyprctl -j clients | jq -r '.[] | ((.title // .class // \"Untitled\") | gsub(\"[\\\\t\\\\r\\\\n]+\"; \" \")) as $title | ((.class // \"\") | gsub(\"[\\\\t\\\\r\\\\n]+\"; \" \")) as $class | \"\\($title) — \\($class) [\\(.address)]\"'); selection=$(printf '%s\\n' \"$clients\" | wofi --dmenu --insensitive --prompt 'Focus window') || exit 0; address=$(printf '%s\\n' \"$selection\" | sed -nE 's/.*\\[(0x[[:xdigit:]]+)\\]$/\\1/p'); [ -n \"$address\" ] && hyprctl dispatch focuswindow \"address:$address\"" }
icon = "focus-windows-symbolic"

[[entries]]
text = "Go to workspace 1"
actions = { "switch" = "hyprctl dispatch workspace 1" }
icon = "user-desktop-symbolic"

